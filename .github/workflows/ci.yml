name: CI

# Phase 0 (2026-11-04) 追加。lint・型チェック (tsc --noEmit)・料金計算の回帰テストを必須ゲートにする。
# lint は React Compiler 系の診断ルールを warn に降格済み (eslint.config.mjs・方針 B) のため error 0 件で通る。
# 既存の cron ワークフロー (issue-due 等) には一切触れていない。
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint (必須ゲート): React Compiler 系の診断ルールを warn に降格済み (eslint.config.mjs・方針 B) のため
      # error は 0 件で通る。warn は引き続き全件検出し、画面ごとに順次解消していく。
      - name: Lint
        run: npm run lint

      # 型チェック (必須ゲート): 既存の型エラーは Phase 0 で全解消済みのため、通常の tsc --noEmit を必須化。
      - name: Typecheck
        run: npm run typecheck

      # 料金計算の回帰テスト (scripts/test-amount + scripts/test-pricing・DB は偽物・外部送信なし)。
      - name: Pricing regression tests
        run: npm test
