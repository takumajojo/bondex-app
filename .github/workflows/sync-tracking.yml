name: Sync Yamato tracking

# Vercel Hobby プランの cron は 1日1回までしか許可されないため
# (公式ドキュメント: https://vercel.com/docs/cron-jobs/usage-and-pricing)、
# GitHub Actions から定期的に /api/cron/sync-tracking を叩く方式にしている。
#
# 事前設定が必要:
#   Repository → Settings → Secrets and variables → Actions
#   New repository secret: CRON_SECRET = <Vercel 側と同じ値>

on:
  schedule:
    # 毎時 5 分 (00分ちょうどは GitHub Actions が混雑しやすいので少しずらす)
    - cron: "5 * * * *"
  workflow_dispatch: {}  # 手動実行 (Actions タブから "Run workflow" で即実行できる)

jobs:
  sync-tracking:
    runs-on: ubuntu-latest
    steps:
      - name: Call BondEx tracking sync endpoint
        run: |
          # --max-time は関数側 maxDuration(300s)+30s。短いと実行中に切断→誤判定リトライ→二重起動になる
          for attempt in 1 2; do
            echo "Attempt $attempt of 2"
            response=$(curl -s -w "\n%{http_code}" --max-time 330 \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              https://bondex.express/api/cron/sync-tracking)
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')
            echo "HTTP status: $http_code"
            echo "$body"
            if [ "$http_code" -lt 400 ]; then
              exit 0
            fi
            [ "$attempt" -eq 1 ] && sleep 15
          done
          echo "::error::sync-tracking failed after 2 attempts"
          exit 1
