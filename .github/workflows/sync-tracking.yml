name: Sync Yamato tracking

# 定時実行は Supabase の pg_cron へ移した (2026-09-29 谷口さん)。GitHub Actions の schedule は
# 実測で約4時間おきにしか動かず、配達完了メールが遅れたため。
#   pg_cron ジョブ名: sync-tracking-30min
#   日本時間 8:00〜21:30 の30分おき (22:00〜翌8:00 は止める)
#   CRON_SECRET は Supabase Vault の "cron_secret" に保存
# このワークフローは手動実行 (Actions タブの "Run workflow") 用に残す。
#
# 事前設定が必要:
#   Repository → Settings → Secrets and variables → Actions
#   New repository secret: CRON_SECRET = <Vercel 側と同じ値>

on:
  workflow_dispatch: {}  # 手動実行 (Actions タブから "Run workflow" で即実行できる)

jobs:
  sync-tracking:
    runs-on: ubuntu-latest
    steps:
      - name: Call BondEx tracking sync endpoint
        run: |
          # --max-time は関数側 maxDuration(300s)+30s。短いと実行中に切断→誤判定リトライ→二重起動になる
          for attempt in 1 2; do
            echo "Attempt $attempt of 2"
            response=$(curl -s -w "\n%{http_code}" --max-time 330 \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              https://bondex.express/api/cron/sync-tracking)
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')
            echo "HTTP status: $http_code"
            echo "$body"
            if [ "$http_code" -lt 400 ]; then
              exit 0
            fi
            [ "$attempt" -eq 1 ] && sleep 15
          done
          echo "::error::sync-tracking failed after 2 attempts"
          exit 1
