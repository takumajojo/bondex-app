name: Issue-due daily auto-issue

# 送り状の自動発行 (既定)。発送日が今日〜30日先で未発行の予約を毎朝拾い、
# 送り状を自動発行 → Drive 格納 → 代理店へ通知する (/api/cron/issue-due)。
# AUTO_ISSUE_ENABLED="false" のときのみ「発行してください」ダイジェスト通知に切り替わる。
#
# 事前設定 (sync-tracking と共通):
#   Repository → Settings → Secrets and variables → Actions
#   New repository secret: CRON_SECRET = <Vercel 側と同じ値>

on:
  schedule:
    # 毎日 23:10 UTC = 08:10 JST (運用の朝イチに届く)
    - cron: "10 23 * * *"
  workflow_dispatch: {}  # 手動実行 (Actions タブから即実行)

jobs:
  issue-due:
    runs-on: ubuntu-latest
    steps:
      - name: Call BondEx issue-due digest endpoint
        run: |
          # --max-time は関数側 maxDuration(300s)+30s。短いと実行中に切断→誤判定リトライ→二重起動になる
          for attempt in 1 2; do
            echo "Attempt $attempt of 2"
            response=$(curl -s -w "\n%{http_code}" --max-time 330 \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              https://bondex.express/api/cron/issue-due)
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')
            echo "HTTP status: $http_code"
            echo "$body"
            if [ "$http_code" -lt 400 ]; then
              exit 0
            fi
            [ "$attempt" -eq 1 ] && sleep 15
          done
          echo "::error::issue-due digest failed after 2 attempts"
          exit 1
